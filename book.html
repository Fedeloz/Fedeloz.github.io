      name="description"
      content="Book a 30-minute meeting with Federico Lozano-Cuadra."
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="portfolio.css">
    <script src="navigation.js" defer></script>
    <script src="booking.js" defer></script>
    <script src="constellations.js" defer></script>
  </head>
  <body>

    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Federico Lozano-Cuadra, home">Federico Lozano-Cuadra</a>
        <button class="menu-switch" type="button" aria-controls="primary-links" aria-expanded="false" hidden>Menu <span aria-hidden="true">☰</span></button>
        <nav class="site-nav" id="primary-links" aria-label="Primary navigation">
          <a href="./">Home</a>
          <a href="research/">Research</a>
          <a href="career.html">Career</a>
          <a href="entrepreneurship.html">Entrepreneurship</a>
          <a href="awards.html">Awards</a>
          <a href="press.html">Events &amp; media</a>
          <a href="book.html" class="nav-book" aria-current="page">Book me</a>
        </nav>
      </header>

      <main>
        <section class="panel booking-page" aria-labelledby="booking-title">
          <div class="booking-intro">
            <h1 id="booking-title">Let’s chat.</h1>
            <p>Have a research idea or a question about my work? Pick a time for a 30-minute Google Meet, or <a href="#booking-message">send me a note</a>.</p>
          </div>
          <div class="booking-calendar">
            <div class="booking-calendar-header">
              <h2>Book a meeting</h2>
              <a href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ27-ELg4kFVZHBnlqfxKuWe0vO4KwoxXav23JXqBrF0_kxCr_OLRl2mFDdGAApO9P7wXeBcHrn_" target="_blank" rel="noopener noreferrer">Open in Google Calendar <span aria-hidden="true">↗</span></a>
            </div>
            <iframe title="Choose a time for a 30-minute meeting with Federico" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ27-ELg4kFVZHBnlqfxKuWe0vO4KwoxXav23JXqBrF0_kxCr_OLRl2mFDdGAApO9P7wXeBcHrn_?gv=true"></iframe>
          </div>
          <form class="booking-note" action="mailto:federico.lozano.cuadra@gmail.com" method="get">
            <label for="booking-message">Your message</label>
            <input type="hidden" name="subject" value="Let’s connect">
            <textarea id="booking-message" name="body" rows="4" placeholder="What would you like to talk about?"></textarea>
            <button type="submit" aria-label="Open an email draft to Federico" title="Open email draft">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6.75A1.75 1.75 0 0 1 4.75 5h14.5A1.75 1.75 0 0 1 21 6.75v10.5A1.75 1.75 0 0 1 19.25 19H4.75A1.75 1.75 0 0 1 3 17.25V6.75Zm1.75-.25a.25.25 0 0 0-.17.43L12 12.83l7.42-5.9a.25.25 0 0 0-.17-.43H4.75Zm14.75 10.73V8.47l-6.57 5.22a1.5 1.5 0 0 1-1.86 0L4.5 8.47v8.76c0 .14.11.25.25.25h14.5a.25.25 0 0 0 .25-.25Z" />
              </svg>
            </button>
          </form>
        </section>
      </main>
    </div>
  </body>
